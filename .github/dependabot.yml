# Keep the GitHub Actions in .github/workflows up to date.
# Dependabot opens one pull request a month when new versions are out; the tests run on it before you merge.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: CI
