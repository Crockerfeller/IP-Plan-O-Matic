# Test, build and deploy the site to GitHub Pages.
# Every push to main runs the browser test suites against the built site (Chrome, plus WebKit and Firefox) and checks every export format with its
# real tool (terraform, bicep, cfn-lint, php, pwsh, shellcheck); only if all of that passes is it deployed.
# Pull requests run the tests without deploying.
# One-time setup: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per branch at a time; a deploy in progress is never cancelled halfway.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Guides match their generator
        run: python3 tools/build_learn.py --check
      - name: Run the test suites (headless Chrome)
        run: tests/run.sh

  # ESLint: likely bugs in the app's script, the guides, the service worker and the tests (eslint.config.mjs).
  # TypeScript checks app.js's types (tsconfig.json); nothing is compiled.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  # The same suites in Safari's engine (WebKit) and Firefox, through Playwright (tests/browsers.mjs), and the
  # accessibility scan (tests/a11y.mjs).
  # Runs in Playwright's own image, which has both browsers and their system libraries, so nothing is downloaded
  # (installing them with --with-deps on the runner can hang). Keep the tag equal to the playwright version in
  # package.json; tests/browsers.mjs checks they match.
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
    env:
      HOME: /root   # Firefox refuses to run as root with a HOME owned by another user (GitHub's default)
    steps:
      # git before checkout, so the checkout is a real repository (the build stamps the commit hash).
      - name: Python and git, for the site build and the test server
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends python3 git ca-certificates > /dev/null
      - uses: actions/checkout@v7
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: npm ci
      - name: Run the test suites in WebKit and Firefox
        run: npm run test:browsers
      - name: Accessibility (axe-core, WCAG 2.2 AA, light and dark)
        run: npm run test:a11y

  # Every export format checked by the tool that would consume it (tests/check_exports.py).
  exports:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - name: Install the checkers
        # Already on the runner: Google Chrome, PowerShell (pwsh), PHP, ShellCheck.
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet cfn-lint pyyaml openpyxl
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/bicep" https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
          chmod +x "$RUNNER_TEMP/bin/bicep"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Check every export with its real tool
        run: python3 tests/check_exports.py --require-all

  deploy:
    needs: [test, lint, browsers, exports]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Build the site, stamped with this commit
        run: python3 tools/build_site.py _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
