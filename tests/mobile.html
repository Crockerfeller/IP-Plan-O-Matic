<!doctype html><meta charset="utf-8"><meta name="robots" content="noindex"><title>Phone layout tests</title><iframe id="f" style="width:375px;height:800px"></iframe><pre id="out">running</pre>
<script src="lib.js"></script>
<script>(async()=>{try{
await load('../index.html#'+encodeURI(`10.0.0.0/22/3.2/${btoa(JSON.stringify({l:'HQ',b:[['172.16.0.0/16','1.0','aws','Prod VPC']]})).replace(/=+$/,'')}`));
for (const t of ['plan','vlsm','tools','export','v6']) {
  click('#tb-'+t); if (t==='v6') $('v6PlanCard').open = true; await sleep(50);
  const de = D.documentElement;
  // find widest offender
  let worst = null; for (const el of D.querySelectorAll('body *')) { const r = el.getBoundingClientRect(); if (r.width && r.right > de.clientWidth + 1 && !el.closest('.table-wrap') && !el.closest('nav.tabs')) { if (!worst || r.right > worst.r) worst = { r: Math.round(r.right), el: el.tagName + '#' + el.id + '.' + el.className }; } }
  check(`no sideways scroll on ${t}`, de.scrollWidth <= de.clientWidth + 1, { sw: de.scrollWidth, cw: de.clientWidth, worst });
}
click('#plansBtn'); await sleep(50);
const dr = $('plansDlg').getBoundingClientRect();
check('plans dialog fits', dr.right <= D.documentElement.clientWidth + 1, dr.right);
$('plansDlg').close(); click('#tplBtn'); await sleep(50);
const ar = $('azDlg').getBoundingClientRect();
check('azure dialog fits', ar.right <= D.documentElement.clientWidth + 1 && $('azDlg').scrollWidth <= $('azDlg').clientWidth + 1, { r: ar.right, sw: $('azDlg').scrollWidth, cw: $('azDlg').clientWidth });
select('#azLayout', 'hub');
const ar2 = $('azDlg').getBoundingClientRect();
check('hub-and-spoke dialog fits', ar2.right <= D.documentElement.clientWidth + 1 && $('azDlg').scrollWidth <= $('azDlg').clientWidth + 1, { r: ar2.right, sw: $('azDlg').scrollWidth });
$('azDlg').close(); click('#tb-plan'); click('#peerBtn'); await sleep(50);
const pr = $('peerDlg').getBoundingClientRect();
check('peering dialog fits', $('peerDlg').open && pr.right <= D.documentElement.clientWidth + 1 && $('peerDlg').scrollWidth <= $('peerDlg').clientWidth + 1, { r: pr.right, sw: $('peerDlg').scrollWidth, cw: $('peerDlg').clientWidth });
// IP assignments dialog
$('peerDlg').close(); click('#tb-plan');
qa('#body tr')[0].querySelector('.hosts-btn').click(); await sleep(50);
const hr = $('hostsDlg').getBoundingClientRect();
check('IP addresses dialog fits', $('hostsDlg').open && hr.right <= D.documentElement.clientWidth + 1 && $('hostsDlg').scrollWidth <= $('hostsDlg').clientWidth + 1, { r: hr.right, sw: $('hostsDlg').scrollWidth, cw: $('hostsDlg').clientWidth });
$('hostsDlg').close();
// Guide pages: the CIDR table and a few prefix pages (wide tables scroll inside their own box).
for (const g of ['cidr-cheat-sheet', 'subnet-sizes', 'subnetting-practice', 'slash-26-subnet', 'slash-8-subnet', 'ipv6-slash-48']) {
  await load('../learn/' + g + '.html');
  const de = D.documentElement;
  check(`no sideways scroll on guide ${g}`, de.scrollWidth <= de.clientWidth + 1, { sw: de.scrollWidth, cw: de.clientWidth });
}
done();}catch(e){errors.push(e.stack);done();}})();</script>
