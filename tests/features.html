T.undo = async () => {
  await load('../index.html#10.0.0.0/24');
  check('undo disabled at start', $('undoBtn').disabled);
  divideRow(0); divideRow(0); divideRow(0);
  const four = snap().rows.length;
  type(qa('#body tr')[0].querySelector('input'), 'Servers');
  // simulate typing more characters in the same focus session
  const inp = qa('#body tr')[0].querySelector('input');
  inp.focus(); inp.value = 'Servers2'; inp.dispatchEvent(new W.Event('input', { bubbles: true })); inp.value = 'Servers22'; inp.dispatchEvent(new W.Event('input', { bubbles: true })); inp.blur();
  // join the top-level bar (/24)
  const bars = qa('#body td.bar.joinable');
  bars.find((b) => b.textContent.startsWith('/24')).click();
  check('joined', snap().rows.length === 1);
  check('join toast has undo', !!q('#toast button'));
  q('#toast button').click();
  check('undo join restores rows + name', snap().rows.length === four && qa('#body tr')[0].querySelector('input').value === 'Servers22', snap().rows);
  click('#undoBtn');
  check('second edit session undone', qa('#body tr')[0].querySelector('input').value === 'Servers', qa('#body tr')[0].querySelector('input').value);
  click('#undoBtn');
  check('first edit session undone', qa('#body tr')[0].querySelector('input').value === '');
  key('z');
  check('ctrl+z undoes divide', snap().rows.length === 3, snap().rows.length);
  key('z', { shiftKey: true });
  check('ctrl+shift+z redoes', snap().rows.length === 4);
  // native undo inside an input is left alone
  const i2 = qa('#body tr')[1].querySelector('input');
  i2.focus();
  const ev = new W.KeyboardEvent('keydown', { key: 'z', ctrlKey: true, bubbles: true, cancelable: true });
  i2.dispatchEvent(ev);
  check('ctrl+z in input not intercepted', !ev.defaultPrevented && snap().rows.length === 4);
  i2.blur();
  // multi-block undo
  addBox('172.16.0.0/16 B');
  check('block added', chipsB().length === 2);
  key('z');
  check('undo add block', chipsB().length === 0 && snap().rows.length === 4, $('blocks').textContent);
  // ipv6
  click('#tb-v6');
  qa('#v6Body tr')[0].querySelectorAll('.v6-btns button')[1].click();
  check('v6 split', qa('#v6Body tr').length === 16);
  click('#v6Undo');
  check('v6 undo', qa('#v6Body tr').length === 1);
  key('y');
  check('ctrl+y redo v6', qa('#v6Body tr').length === 16);
  // platform change undo
  click('#tb-plan');
  select('#platform', 'azure');
  key('z');
  check('undo platform', $('platform').value === 'std');
};

T.updateCheck = async () => {
  await load('../index.html#10.0.0.0/24');
  check('update link shown off the hosted site', !$('updBtn').hidden);
  const real = W.fetch.bind(W);
  let remote = '0'.repeat(40), offline = false;
  W.fetch = (u, o) => {
    if (!String(u).startsWith('https://api.github.com/')) return real(u, o);
    if (offline) return Promise.reject(new TypeError('offline'));
    const body = String(u).includes('/contents/') ? { sha: remote } : [{ sha: 'c'.repeat(40), commit: { message: 'Add things\n\nmore', committer: { date: '2026-11-20T10:00:00Z' } } }];
    return Promise.resolve(new W.Response(JSON.stringify(body), { status: 200 }));
  };
  dialogs.length = 0; confirmAnswer = false;
  click('#updBtn'); await sleep(300);
  const mine = $('updBtn').dataset.local;
  check('update: local version hashed', /^[0-9a-f]{40}$/.test(mine), mine);
  check('update: newer version prompt', dialogs.length === 1 && dialogs[0].includes('newer version') && dialogs[0].includes('2026-11-20: “Add things”') && dialogs[0].includes('git pull'), dialogs);
  remote = mine; dialogs.length = 0;
  click('#updBtn'); await sleep(300);
  check('update: up to date', dialogs.length === 0 && $('toast').textContent.includes('You have the latest version (updated 2026-11-20)'), $('toast').textContent);
  offline = true;
  click('#updBtn'); await sleep(300);
  check('update: offline message', $('toast').textContent.includes('Couldn’t reach GitHub'), $('toast').textContent);
  offline = false; remote = null;
  const realF = W.fetch;
  W.fetch = (u, o) => (String(u).startsWith('https://api.github.com/') ? Promise.resolve(new W.Response('{}', { status: 403 })) : real(u, o));
  click('#updBtn'); await sleep(300);
  check('update: rate limit message', $('toast').textContent.includes('limiting update checks'), $('toast').textContent);
  W.fetch = realF;
  check('update: link text restored', $('updBtn').textContent.includes('Check for updates'));
  W.fetch = real; confirmAnswer = true;
  document.title = 'local-blob:' + mine;
};
